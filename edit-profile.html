<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - S</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f0f2f5;
    }

    header {
      height: 60px;
      background: white;
      display: flex;
      align-items: center;
      padding: 0 25px;
      gap: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    .logo {
      width: 42px;
      height: 42px;
      background: #1877f2;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    .back {
      color: #1877f2;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    h1 {
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    .save {
      margin-top: 25px;
      width: 100%;
      padding: 13px;
      background: #1877f2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .cancel {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #1877f2;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">S</div>
    <a class="back" href="profile.html">← Back to Profile</a>
  </header>

  <div class="container">

    <h1>Edit Profile</h1>

    <label for="name">Name</label>
    <input
      type="text"
      id="name"
      value="Souvenir Raimond"
    >

    <label for="bio">Bio</label>
    <textarea id="bio">Welcome to my S profile 🚀</textarea>

    <label for="photo">Profile Photo URL</label>
    <input
      type="text"
      id="photo"
      placeholder="Paste image URL here"
    >

    <button class="save" onclick="saveProfile()">
      Save Changes
    </button>

    <a class="cancel" href="profile.html">
      Cancel
    </a>

  </div>

  <script>
    function saveProfile() {
      const name = document.getElementById("name").value;
      const bio = document.getElementById("bio").value;

      localStorage.setItem("profileName", name);
      localStorage.setItem("profileBio", bio);

      alert("Profile saved successfully!");

      window.location.href = "profile.html";
    }
  </script>

</body>
</html>
