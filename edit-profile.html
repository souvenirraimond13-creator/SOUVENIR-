<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Edit Profile - S</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
    }

    header {
      height: 60px;
      background: white;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 25px;
      box-shadow: 0 1px 5px #ccc;
    }

    .logo {
      width: 42px;
      height: 42px;
      background: #1877f2;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    .back {
      color: #1877f2;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      width: 90%;
      max-width: 600px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 2px 10px #ccc;
    }

    h1 {
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 8px;
    }

  input,
textarea {
  display: block !important;
  width: 100% !important;
  min-height: 50px !important;
  padding: 15px !important;
  margin-top: 8px !important;
  margin-bottom: 20px !important;
  border: 3px solid red !important;
  border-radius: 8px !important;
  background-color: white !important;
  color: black !important;
  font-size: 18px !important;
  visibility: visible !important;
  opacity: 1 !important;
}

textarea {
  height: 130px !important;
}

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #1877f2;
      outline: none;
    }

    .save {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #1877f2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .cancel {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #1877f2;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">S</div>

    <a class="back" href="profile.html">
      ← Back to Profile
    </a>
  </header>

  <div class="container">

    <div class="card">

      <h1>Edit Profile</h1> 
 
      <label for="name">Name</label>

<input
  type="text"
  id="name"
  value="Souvenir Raimond"
  style="display:block; width:100%; padding:15px; border:2px solid red; background:white; color:black; font-size:18px;"
>

<label for="bio">Bio</label>

<textarea
  id="bio"
  style="display:block; width:100%; height:120px; padding:15px; border:2px solid red; background:white; color:black; font-size:18px;"
>Welcome to my S profile 🚀</textarea>
      <label for="photo">Profile Photo URL</label>

      <input
        type="text"
        id="photo"
        placeholder="Paste image URL here"
      >

      <button
        class="save"
        onclick="saveProfile()"
      >
        Save Changes
      </button>

      <a
        class="cancel"
        href="profile.html"
      >
        Cancel
      </a>

    </div>

  </div>

  <script>
    function saveProfile() {

      const name =
        document.getElementById("name").value;

      const bio =
        document.getElementById("bio").value;

      const photo =
        document.getElementById("photo").value;

      localStorage.setItem(
        "profileName",
        name
      );

      localStorage.setItem(
        "profileBio",
        bio
      );

      localStorage.setItem(
        "profilePhoto",
        photo
      );

      alert("Profile saved successfully!");

      window.location.href =
        "profile.html";
    }
  </script>

</body>
</html>
